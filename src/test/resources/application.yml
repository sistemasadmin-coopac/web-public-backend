spring:
  application:
    name: cac-elsavaldor-backend-test

  # Use H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # JPA configuration for tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # H2 Console (for debugging if needed)
  h2:
    console:
      enabled: false

  # Disable SQL initialization for tests
  sql:
    init:
      mode: never

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
    session:
      timeout: 3600s
      cookie:
        name: SESSIONID
        http-only: true
        secure: false
        same-site: none
        path: /

  # Configuración de seguridad OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id.apps.googleusercontent.com
            client-secret: test-client-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com

  jackson:
    time-zone: America/Lima

# Server configuration for tests
server:
  port: 0
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

# Configuración de aplicación
app:
  frontend:
    url: http://localhost:4200
  authorized:
    admins: test@example.com,admin@test.com

# CORS Configuration
cors:
  allowed:
    origins:
      - http://localhost:4200
      - http://localhost:3000
      - https://coopacelsalvador.com

# File Storage Configuration
file:
  storage:
    type: local
    local:
      base-path: ./uploads
    gcs:
      bucket-name: test-bucket
      project-id: test-project

# Google OAuth Configuration
google:
  client:
    id: test-client-id.apps.googleusercontent.com

# JWT Configuration
jwt:
  secret: test_secret_key_for_testing_purposes_must_be_at_least_256_bits_long
  expiration: 86400000

