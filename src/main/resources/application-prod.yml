spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:web-public-coopac-db}?cloudSqlInstance=${CLOUD_SQL_INSTANCE:coopac-elsalvador-backend:us-central1:coopac-elsalvador-web-public-db}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=false&loginTimeout=10&socketTimeout=10
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Optimizaciones de HikariCP para Cloud Run
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000
      leak-detection-threshold: 30000
      auto-commit: true
      initialization-fail-timeout: 1000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "https://api-web.coopacelsalvador.com/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com

  # Lazy initialization deshabilitada para startup predecible
  main:
    lazy-initialization: false

  jpa:
    # Validación de schema en startup
    hibernate:
      ddl-auto: validate
    show-sql: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        # Optimizaciones de Hibernate
        jdbc:
          batch_size: 10
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Configuración de sesión para subdominios compartidos
  session:
    store-type: none
    timeout: 3600s
    cookie:
      name: JSESSIONID
      http-only: true
      secure: true
      same-site: none
      path: /
      domain: coopacelsalvador.com

  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: immediate
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        domain: coopacelsalvador.com
  tomcat:
    threads:
      max: 50
      min-spare: 5
    accept-count: 100
    max-connections: 500
    connection-timeout: 5000
    keep-alive-timeout: 15000
    accept-backlog: 50

app:
  frontend:
    url: https://coopacelsalvador.com

cors:
  allowed:
    origins:
      - https://coopacelsalvador.com
      - https://www.coopacelsalvador.com
      - https://api-web.coopacelsalvador.com

file:
  storage:
    type: ${STORAGE_TYPE:gcs}
    gcs:
      bucket-name: ${GCS_BUCKET_NAME}
      project-id: ${GCP_PROJECT_ID}

logging:
  level:
    root: ERROR
    com.elsalvador.coopac: WARN
    org.springframework.boot: ERROR
    org.springframework.security: ERROR
  format: json
  config: classpath:logback-prod.xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: false
  simple:
    metrics:
      export:
        enabled: false
