spring:
  datasource:
    url: jdbc:postgresql:///${DB_NAME:web-public-coopac-db}?cloudSqlInstance=${CLOUD_SQL_INSTANCE:coopac-elsalvador-backend:us-central1:coopac-elsalvador-web-public-db}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Optimizaciones de HikariCP para Cloud Run
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 120000
      max-lifetime: 600000
      leak-detection-threshold: 60000
      auto-commit: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "https://api-web.coopacelsalvador.com/login/oauth2/code/google"
        provider:
          google:
            issuer-uri: https://accounts.google.com

  # Lazy initialization para reducir tiempo de startup
  main:
    lazy-initialization: true

  jpa:
    # No hacer validación de schema en startup
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        # Optimizaciones de Hibernate
        jdbc:
          batch_size: 10
          fetch_size: 50
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # Configuración de sesión para subdominios compartidos
  session:
    store-type: none
    timeout: 3600s
    cookie:
      name: JSESSIONID
      http-only: true
      secure: true
      same-site: none
      path: /
      domain: coopacelsalvador.com

  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful
  shutdown-wait-time: 30s
  forward-headers-strategy: framework
  compression:
    enabled: true
    min-response-size: 1024
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
        domain: coopacelsalvador.com
  tomcat:
    threads:
      max: 20
      min-spare: 2
    accept-count: 50
    max-connections: 200

app:
  frontend:
    url: https://coopacelsalvador.com

cors:
  allowed:
    origins:
      - https://coopacelsalvador.com
      - https://www.coopacelsalvador.com
      - https://api-web.coopacelsalvador.com

file:
  storage:
    type: ${STORAGE_TYPE:gcs}
    gcs:
      bucket-name: ${GCS_BUCKET_NAME}
      project-id: ${GCP_PROJECT_ID}

logging:
  level:
    root: WARN
    com.elsalvador.coopac: INFO
    org.springframework.boot: WARN
    org.springframework.security: WARN
  format: json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
  simple:
    metrics:
      export:
        enabled: true
